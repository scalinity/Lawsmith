[package]
name = "lawsmith"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Tauri 3 prerelease family, pinned exactly (SPEC §3). Component versions differ by design.
[build-dependencies]
tauri-build = { version = "=3.0.0-alpha.3", features = [] }

[dependencies]
tauri = { version = "=3.0.0-alpha.4", features = [] }
tauri-runtime-wry = "=3.0.0-alpha.4"
# Native Open/Save dialogs (SPEC §15.3): the official Tauri 3 line, resolved against the pinned family.
tauri-plugin-dialog = "=3.0.0-alpha.2"
serde = { version = "=1.0.229", features = ["derive"] }

# Already locked through TAO; used only to give TAO's app delegate `applicationShouldTerminate:`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"

# The published tauri-plugin-dialog 3.0.0-alpha.2 (crates.io checksum b2e3971a…, official tag
# dialog-v3.0.0-alpha.2) does not build against tauri 3.0.0-alpha.4, which moved
# `run_on_main_thread` onto the `Manager` trait. The vendored copy is that exact archive plus the
# one-line `Manager` import from upstream PR tauri-apps/plugins-workspace#3655 (owner decision,
# M2). Remove this patch once a fixed official release is published and qualified.
[patch.crates-io]
tauri-plugin-dialog = { path = "vendor/tauri-plugin-dialog-3.0.0-alpha.2" }
